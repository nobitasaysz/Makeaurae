<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MakeAurae — Create Smarter</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #08090f;
      color: #fff;
      min-height: 100vh;
    }

    header {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1d2030;
      position: sticky;
      top: 0;
      background: rgba(8,9,15,.92);
      backdrop-filter: blur(12px);
      z-index: 10;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .logo span {
      color: #9b6cff;
    }

    .menu {
      font-size: 22px;
      color: #aaa;
    }

    .hero {
      padding: 55px 20px 35px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 7px 13px;
      border: 1px solid #30264c;
      border-radius: 50px;
      color: #b89aff;
      font-size: 12px;
      margin-bottom: 18px;
      background: #110d1d;
    }

    h1 {
      font-size: 40px;
      line-height: 1.05;
      margin-bottom: 15px;
    }

    h1 span {
      background: linear-gradient(90deg,#a86cff,#5d9dff);
      -webkit-background-clip: text;
      color: transparent;
    }

    .hero p {
      color: #999dad;
      max-width: 500px;
      margin: auto;
      line-height: 1.6;
      font-size: 15px;
    }

    .search {
      margin: 28px auto 0;
      max-width: 550px;
      display: flex;
      background: #11131c;
      border: 1px solid #282b3b;
      border-radius: 14px;
      padding: 5px;
    }

    .search input {
      flex: 1;
      border: 0;
      outline: none;
      background: transparent;
      color: white;
      padding: 14px;
      font-size: 14px;
    }

    .search button {
      border: 0;
      border-radius: 10px;
      padding: 0 18px;
      background: #8b5cf6;
      color: white;
      font-weight: 700;
    }

    .section {
      padding: 25px 20px;
      max-width: 1100px;
      margin: auto;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .section-title h2 {
      font-size: 20px;
    }

    .section-title span {
      color: #8f93a3;
      font-size: 12px;
    }

    .tools {
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
      gap: 14px;
    }

    .tool {
      background: #10121b;
      border: 1px solid #202332;
      border-radius: 16px;
      padding: 20px;
      transition: .2s;
      cursor: pointer;
    }

    .tool:hover {
      transform: translateY(-3px);
      border-color: #7450c9;
    }

    .icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: #19152a;
      font-size: 20px;
      margin-bottom: 15px;
    }

    .tool h3 {
      font-size: 16px;
      margin-bottom: 7px;
    }

    .tool p {
      color: #858998;
      font-size: 13px;
      line-height: 1.5;
    }

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .category {
      white-space: nowrap;
      padding: 11px 17px;
      border: 1px solid #272a39;
      background: #11131c;
      border-radius: 50px;
      color: #b7bac5;
      font-size: 13px;
    }

    .category.active {
      background: #8b5cf6;
      border-color: #8b5cf6;
      color: white;
    }

    footer {
      text-align: center;
      padding: 45px 20px 90px;
      color: #666a78;
      font-size: 12px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(12,13,20,.96);
      border-top: 1px solid #202332;
      display: flex;
      justify-content: space-around;
      padding: 12px 5px;
      z-index: 20;
    }

    .nav-item {
      color: #777b89;
      font-size: 11px;
      text-align: center;
    }

    .nav-item b {
      display: block;
      font-size: 18px;
      margin-bottom: 3px;
    }
